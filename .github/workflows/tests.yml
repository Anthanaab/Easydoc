# Tests automatiques d'Easydoc : à chaque envoi et à chaque demande de fusion.
# Linux (comme les installations Proxmox et Docker) avec Node 22 (version minimale) et 24,
# et Windows (disque insensible à la casse, liens, fins de ligne CRLF).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # Les journaux ne sont visibles qu'aux personnes connectées : les échecs sont aussi publiés en
      # annotations (lisibles par tous, y compris par l'API publique de GitHub).
      - name: Résumé des échecs
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          # chaque échec avec les lignes qui suivent (format « spec » et format TAP : error, failureType, code…)
          grep -nE -A14 "^\s*(✖|not ok)" test-output.txt | grep -vE "^\S*-\s*$" | head -90 > echecs.txt || true
          echo "::error title=Tests en échec (${{ matrix.os }}, Node ${{ matrix.node }})::$(sed -e 's/%/%25/g' echecs.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          { echo '### Tests en échec'; echo '```'; cat echecs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Le fichier construit est versionné (les serveurs ne le reconstruisent pas) : il doit
      # correspondre exactement aux sources de client/. Sinon : « npm run build » a été oublié.
      - name: Bibliothèques navigateur à jour
        if: runner.os == 'Linux'
        run: |
          npm run build
          git diff --exit-code --stat -- public/vendor/libs.js || {
            echo "::error::public/vendor/libs.js ne correspond pas aux sources : lance « npm run build » et versionne le résultat."
            exit 1
          }
