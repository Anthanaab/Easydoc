services:
  easydoc:
    build: .
    image: easydoc:latest
    container_name: easydoc
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Le dépôt GitHub se connecte depuis l'interface (Réglages) ; rien à configurer ici.
    volumes:
      - easydoc_data:/app/data
    stop_grace_period: 20s

volumes:
  easydoc_data:
