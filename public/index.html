<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Easydoc</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M10 10h12M10 16h12M10 22h7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script>
    // thème appliqué avant l'affichage (évite un flash)
    (function () {
      var t = localStorage.getItem("ed-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-mode">
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div class="brand-text">
          <div class="brand-name">Easydoc</div>
          <button class="workspace" id="workspace" title="Dépôt connecté — cliquer pour modifier">
            <span data-icon="branch"></span><span id="workspaceLabel">…</span>
          </button>
        </div>
      </div>

      <div class="side-tools">
        <label class="search">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="Rechercher partout (Ctrl K)" autocomplete="off" />
          <kbd>Ctrl K</kbd>
        </label>
        <div class="search-results" id="searchResults" hidden></div>
        <div class="tool-row">
          <button class="btn btn-primary" id="btnNew"><span data-icon="plus"></span>Nouveau document</button>
          <button class="btn btn-icon" id="btnUpload" title="Importer des fichiers (PDF, Word, images…)"><span data-icon="upload"></span></button>
        </div>
        <input type="file" id="fileInput" multiple hidden />
      </div>

      <nav class="tree" id="tree" aria-label="Documents"></nav>

      <div class="side-foot">
        <button class="me" id="btnMe" title="Mon compte">
          <span class="avatar" id="meAvatar"></span><span class="me-name" id="meName"></span>
        </button>
        <div class="side-foot-actions">
          <button class="icon-btn" id="btnTheme" title="Thème clair / sombre"><span data-icon="moon"></span></button>
          <button class="icon-btn admin-only" id="btnSettings" title="Administration : utilisateurs, droits d'accès, dépôt" hidden><span data-icon="settings"></span></button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btnMenu" title="Documents"><span data-icon="menu"></span></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="status" id="status"></div>
        <div class="spacer"></div>
        <div class="presence" id="presence"></div>
        <div class="segmented" id="viewSwitch" role="tablist" aria-label="Affichage">
          <button data-view="edit" title="Éditer"><span data-icon="pencil"></span><span class="lbl">Éditer</span></button>
          <button data-view="split" title="Côte à côte"><span data-icon="columns"></span><span class="lbl">Côte à côte</span></button>
          <button data-view="preview" title="Aperçu"><span data-icon="eye"></span><span class="lbl">Aperçu</span></button>
        </div>
        <button class="icon-btn tb-more-item" id="btnCopyLink" title="Copier le lien vers ce document (Ctrl+L)" hidden><span data-icon="link"></span></button>
        <button class="icon-btn tb-more-item" id="btnToc" title="Table des matières (aperçu)" hidden><span data-icon="list"></span></button>
        <button class="icon-btn" id="btnComments" title="Tous les commentaires" hidden><span data-icon="comment"></span><span class="c-badge" id="ccBadge" hidden></span></button>
        <button class="icon-btn tb-more-item" id="btnAuthors" title="Qui a écrit quoi : couleur par auteur" aria-pressed="false" hidden><span data-icon="highlight"></span></button>
        <button class="icon-btn tb-more-item" id="btnHistory" title="Historique des modifications" hidden><span data-icon="history"></span></button>
        <button class="icon-btn tb-more-item" id="btnAccess" title="Qui peut voir ou modifier ce fichier" hidden><span data-icon="lock"></span></button>
        <button class="icon-btn tb-more-item" id="btnSync" title="Récupérer les modifications du dépôt"><span data-icon="refresh"></span></button>
        <button class="icon-btn tb-more-item" id="btnDelete" title="Supprimer ce document"><span data-icon="trash"></span></button>
        <button class="icon-btn" id="btnMore" title="Plus d'actions" aria-haspopup="menu" aria-expanded="false"><span data-icon="more"></span></button>
        <button class="btn btn-primary" id="btnSave" title="Enregistrer maintenant (Ctrl+S)"><span data-icon="check"></span><span class="lbl">Enregistrer</span></button>
      </header>

      <section class="area" id="area" data-view="edit" data-state="empty">
        <div class="empty" id="empty">
          <div class="empty-icon" data-icon="file"></div>
          <h2>Aucun document ouvert</h2>
          <p>Choisis un document dans la liste, crées-en un nouveau ou glisse des fichiers ici.</p>
          <div class="empty-actions">
            <button class="btn btn-primary" id="btnNewEmpty"><span data-icon="plus"></span>Nouveau document</button>
            <button class="btn" id="btnUploadEmpty"><span data-icon="upload"></span>Importer des fichiers</button>
          </div>
        </div>
        <div class="pane pane-editor" id="paneEditor">
          <div class="fmt-bar" id="fmtBar" role="toolbar" aria-label="Mise en forme" hidden>
            <button data-fmt="bold" title="Gras (Ctrl+B)"><b>G</b></button>
            <button data-fmt="italic" title="Italique (Ctrl+I)"><i>I</i></button>
            <button data-fmt="strike" title="Barré (Ctrl+Maj+X)"><s>S</s></button>
            <span class="sep"></span>
            <button data-fmt="h1" title="Titre 1 (Ctrl+Alt+1)">T1</button>
            <button data-fmt="h2" title="Titre 2 (Ctrl+Alt+2)">T2</button>
            <button data-fmt="h3" title="Titre 3 (Ctrl+Alt+3)">T3</button>
            <span class="sep"></span>
            <button data-fmt="ul" title="Liste à puces (Ctrl+Maj+8)"><span data-icon="listUl"></span></button>
            <button data-fmt="ol" title="Liste numérotée (Ctrl+Maj+7)"><span data-icon="listOl"></span></button>
            <button data-fmt="task" title="Liste de cases à cocher (Ctrl+Maj+9)"><span data-icon="task"></span></button>
            <span class="sep"></span>
            <button data-fmt="link" title="Lien"><span data-icon="link"></span></button>
            <button data-fmt="quote" title="Citation"><span data-icon="quote"></span></button>
            <button data-fmt="code" title="Code (Ctrl+E)"><span data-icon="code"></span></button>
          </div>
          <div class="authors-bar" id="authorsBar" hidden></div>
          <div class="editor-host" id="editor"></div>
        </div>
        <div class="pane pane-preview" id="panePreview">
          <article class="prose" id="preview"></article>
        </div>
        <div class="pane pane-file" id="paneFile"></div>
        <aside class="comments-panel" id="commentsPanel" hidden>
          <div class="cc-headbar">
            <h3>Commentaires</h3>
            <button class="icon-btn sm" id="btnCommentsClose" title="Fermer"><span data-icon="x"></span></button>
          </div>
          <div class="cc-tabs" role="tablist">
            <button data-tab="open" class="on">Ouverts <span class="n" id="ccOpenN"></span></button>
            <button data-tab="resolved">Résolus <span class="n" id="ccDoneN"></span></button>
          </div>
          <div class="comments-list" id="commentsList"></div>
        </aside>
      </section>
    </main>
  </div>

  <div class="auth-tip" id="authTip" hidden></div>
  <div class="dropzone" id="dropzone" aria-hidden="true">
    <div class="dropzone-card"><span data-icon="upload"></span><div id="dropzoneText">Dépose tes fichiers pour les importer</div></div>
  </div>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
