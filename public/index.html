<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Easydoc — espace collaboratif de ton jeu</title>
  <script type="importmap">
  {
    "imports": {
      "yjs": "https://esm.sh/yjs@13.6.18",
      "y-websocket": "https://esm.sh/y-websocket@2.0.4",
      "marked": "https://esm.sh/marked@12.0.2",
      "dompurify": "https://esm.sh/dompurify@3.1.6"
    }
  }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🎮 <b>Easydoc</b><span class="mode" id="mode">…</span></div>
    <div class="actions">
      <span class="conn" id="conn">⏳ connexion…</span>
      <span class="users" id="users"></span>
      <button id="btnPull" title="Récupère les dernières versions du dépôt (incl. les mises à jour écrites par l'agent IA / Claude)">⟳ Sync agent</button>
      <button id="btnSave" title="Enregistrer et publier sur le dépôt (Ctrl+S)">💾 Publier</button>
      <button id="btnPreview" title="Basculer l'aperçu Markdown">👁 Aperçu</button>
      <button id="btnSettings" title="Connecter / changer de dépôt GitHub, ou passer en mode local">⚙️</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="side-head">
        <span>📁 Dépôt</span>
        <button id="btnNew" title="Nouveau document .md">+ ⤴ +</button>
      </div>
      <div id="tree" class="tree"></div>
      <div id="newbox" class="newbox hidden">
        <input id="newpath" placeholder="docs/mon-idee.md" />
        <button id="btnNewGo">Créer</button>
      </div>
      <div class="side-foot">
        <a href="https://docs.github.com/fr/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens" target="_blank">🔑 Connecter ton GitHub</a>
      </div>
    </aside>

    <section class="editor-wrap">
      <div id="editor">
        <textarea id="editor-ta" spellcheck="false"
          placeholder="Ouvre un document dans le menu de gauche, ou clique sur + pour en créer un."></textarea>
        <div id="caret-layer"></div>
      </div>
      <div id="preview" class="preview hidden"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <!-- Fenêtre de réglages : connecter un dépôt GitHub depuis l'interface -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <h3>⚙️ Dépôt connecté</h3>
      <p class="set-cur" id="setCurrent">…</p>
      <div class="radio-row">
        <label><input type="radio" name="setmode" value="github" checked> <b>GitHub</b> (recommandé)</label>
        <label><input type="radio" name="setmode" value="local"> <b>Local</b> (sans GitHub)</label>
      </div>
      <div id="ghFields">
        <label for="setToken">Jeton GitHub <span class="muted">(scope <code>repo</code> — vide = conserver l'actuel)</span></label>
        <input id="setToken" type="password" autocomplete="off" placeholder="ghp_… ou github_pat_…" />
        <label for="setRepo">Dépôt <span class="muted">(proprietaire/repo, ou URL github.com/*)</span></label>
        <input id="setRepo" placeholder="ex : Anthanaab/mon-jeu" />
        <label for="setBranch">Branche <span class="muted">(vide = branche par défaut)</span></label>
        <input id="setBranch" placeholder="main" />
        <div class="btn-row">
          <button id="btnTest">🔌 Tester la connexion</button>
          <button id="btnSaveSettings" class="primary">💾 Enregistrer & reconnecter</button>
        </div>
        <div id="setInfo" class="set-info"></div>
      </div>
      <div id="localFields" class="hidden">
        <p>Mode local : les documents sont stockés dans un <b>dépôt git local</b> sur ce serveur
        (aucun compte GitHub requis). Tu pourras connecter GitHub à tout moment ici.</p>
        <div class="btn-row">
          <button id="btnLocalSave" class="primary">💾 Passer en mode local</button>
        </div>
      </div>
      <button id="btnCloseSettings" class="close">Fermer</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
