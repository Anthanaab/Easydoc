<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Easydoc — espace collaboratif de ton jeu</title>
  <script type="importmap">
  {
    "imports": {
      "yjs": "https://esm.sh/yjs@13.6.18",
      "y-websocket": "https://esm.sh/y-websocket@2.0.4",
      "marked": "https://esm.sh/marked@12.0.2",
      "dompurify": "https://esm.sh/dompurify@3.1.6"
    }
  }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🎮 <b>Easydoc</b><span class="mode" id="mode">…</span></div>
    <div class="actions">
      <span class="conn" id="conn">⏳ connexion…</span>
      <span class="users" id="users"></span>
      <button id="btnPull" title="Récupère les dernières versions du dépôt (incl. les mises à jour écrites par l'agent IA / Claude)">⟳ Sync agent</button>
      <button id="btnSave" title="Enregistrer et publier sur le dépôt (Ctrl+S)">💾 Publier</button>
      <button id="btnPreview" title="Basculer l'aperçu Markdown">👁 Aperçu</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="side-head">
        <span>📁 Dépôt</span>
        <button id="btnNew" title="Nouveau document .md">+ ⤴ +</button>
      </div>
      <div id="tree" class="tree"></div>
      <div id="newbox" class="newbox hidden">
        <input id="newpath" placeholder="docs/mon-idee.md" />
        <button id="btnNewGo">Créer</button>
      </div>
      <div class="side-foot">
        <a href="https://docs.github.com/fr/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens" target="_blank">🔑 Connecter ton GitHub</a>
      </div>
    </aside>

    <section class="editor-wrap">
      <div id="editor">
        <textarea id="editor-ta" spellcheck="false"
          placeholder="Ouvre un document dans le menu de gauche, ou clique sur + pour en créer un."></textarea>
        <div id="caret-layer"></div>
      </div>
      <div id="preview" class="preview hidden"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
